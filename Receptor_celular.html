<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptor_celular - Sinal 4500 Hz</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        h1 {
            color: #00ff66;
            margin-bottom: 2px;
            font-size: 1.8rem;
            text-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
            letter-spacing: 1px;
            text-align: center;
        }

        .subtitulo {
            color: #8b949e;
            font-size: 0.85rem;
            margin-bottom: 12px;
            text-align: center;
        }

        #painel-principal {
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        canvas {
            background-color: #000000;
            border: 2px solid #00ff66;
            border-radius: 6px;
            box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.15);
            width: 100%;
            height: auto;
        }

        .painel-sliders {
            display: flex;
            flex-direction: row;
            gap: 15px;
            width: 100%;
            margin-top: 15px;
            background-color: #21262d;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            box-sizing: border-box;
        }

        .controle-slider {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .controle-slider label {
            font-size: 0.8rem;
            font-weight: bold;
        }

        .controle-slider.l1 label { color: #ffcc00; }
        .controle-slider.l2 label { color: #ff3366; }

        input[type=range] {
            width: 100%;
            accent-color: #00ff66;
        }

        /* Ajustado para 2 colunas amplas */
        .grid-medidores {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            margin-top: 15px;
        }

        .card-medidor {
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 8px;
            text-align: center;
        }

        .card-medidor .rotulo {
            font-size: 0.75rem;
            color: #8b949e;
            text-transform: uppercase;
        }

        .card-medidor .valor {
            font-size: 1.3rem;
            font-weight: bold;
            font-family: monospace;
            color: #ffffff;
            margin-top: 5px;
        }

        .controles-top {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: #238636;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: #2ea043; }

        #btnCongelar { background-color: #8b949e; }
        #btnCongelar.ativo { background-color: #d97706; }

        #btnMute { background-color: #1f6feb; }
        #btnMute.mutado { background-color: #da3633; }

        @media (max-width: 480px) {
            .painel-sliders { flex-direction: column; }
            .card-medidor .valor { font-size: 1.1rem; }
            .controles-top { flex-direction: column; width: 100%; }
        }
    </style>
</head>
<body>

    <h1>Receptor_celular</h1>
    <div class="subtitulo">Medidor de Amplitude & Osciloscópio (4500 Hz)</div>

    <div class="controles-top">
        <button id="btnIniciar">Ligar Entrada de Áudio</button>
        <button id="btnCongelar">Congelar Tela (Hold)</button>
        <button id="btnMute">Vibracall: ATIVO!!</button>
    </div>

    <div id="painel-principal">
        <canvas id="telaOsciloscopio" width="570" height="250"></canvas>
        
        <div class="painel-sliders">
            <div class="controle-slider l1">
                <label for="sliderL1">Inicio Sinal Fraco (longe): <span id="txtL1">0.08</span></label>
                <input type="range" id="sliderL1" min="0.01" max="0.5" step="0.01" value="0.08">
            </div>
            <div class="controle-slider l2">
                <label for="sliderL2">Inicio Sinal Forte (perto): <span id="txtL2">0.25</span></label>
                <input type="range" id="sliderL2" min="0.05" max="0.9" step="0.01" value="0.25">
            </div>
        </div>

        <div class="grid-medidores">
            <div class="card-medidor">
                <div class="rotulo">Amplitude RMS</div>
                <div class="valor" id="valRMS">0.0000</div>
            </div>
            <div class="card-medidor">
                <div class="rotulo">Valor de Pico</div>
                <div class="valor" id="valPico">0.0000</div>
            </div>
        </div>
    </div>

    <script>
        let audioContext;
        let analisador;
        let canvas, canvasCtx;
        let emExecucao = false;
        let telaCongelada = false;
        let vibracallMutado = false;

        // Janela total de visualização na largura da tela (em ms)
        const tempoTotalMs = 2.0;

        let limiteL1 = 0.08;
        let limiteL2 = 0.25;

        let estadoVibracall = "OFF";
        let temporizadorPulsacao = null;
        let temporizadorContinuo = null;
        let estadoLedPulsante = false; // Estado do pisca visual para modo L1

        document.getElementById('sliderL1').addEventListener('input', (e) => {
            limiteL1 = parseFloat(e.target.value);
            document.getElementById('txtL1').textContent = limiteL1.toFixed(2);
        });

        document.getElementById('sliderL2').addEventListener('input', (e) => {
            limiteL2 = parseFloat(e.target.value);
            document.getElementById('txtL2').textContent = limiteL2.toFixed(2);
        });

        document.getElementById('btnCongelar').addEventListener('click', () => {
            telaCongelada = !telaCongelada;
            const btn = document.getElementById('btnCongelar');
            if (telaCongelada) {
                btn.textContent = "Tela Congelada (Pausado)";
                btn.classList.add('ativo');
            } else {
                btn.textContent = "Congelar Tela (Hold)";
                btn.classList.remove('ativo');
            }
        });

        document.getElementById('btnMute').addEventListener('click', () => {
            vibracallMutado = !vibracallMutado;
            const btn = document.getElementById('btnMute');
            if (vibracallMutado) {
                btn.textContent = "Vibracall: MUTE❌";
                btn.classList.add('mutado');
                pararTodosVibracallMotor(); // Desliga o motor de imediato
            } else {
                btn.textContent = "Vibracall: ATIVO!!";
                btn.classList.remove('mutado');
            }
        });

        document.getElementById('btnIniciar').addEventListener('click', async () => {
            if (emExecucao) return;

            canvas = document.getElementById('telaOsciloscopio');
            canvasCtx = canvas.getContext('2d');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    },
                    video: false
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const fonteMicrofone = audioContext.createMediaStreamSource(stream);

                analisador = audioContext.createAnalyser();
                analisador.fftSize = 2048;

                fonteMicrofone.connect(analisador);

                emExecucao = true;
                document.getElementById('btnIniciar').textContent = "Receptor Ativo";
                document.getElementById('btnIniciar').style.backgroundColor = "#1f6feb";

                renderizar();

            } catch (erro) {
                alert("Erro ao acessar a entrada de áudio: " + erro.message);
            }
        });

        function renderizar() {
            if (!emExecucao) return;

            requestAnimationFrame(renderizar);

            if (telaCongelada) return;

            const tamanhoBuffer = analisador.fftSize;
            const dadosFormaOnda = new Uint8Array(tamanhoBuffer);
            analisador.getByteTimeDomainData(dadosFormaOnda);

            canvasCtx.fillStyle = '#000000';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenho da Grade Quadriculada
            desenharGradeReticula();

            // Tracejados de Setpoint L1 e L2
            desenharLinhaSetpoint(limiteL1, '#ffcc00');
            desenharLinhaSetpoint(limiteL2, '#ff3366');

            // Sinal do Sensor
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#00ff66';
            canvasCtx.beginPath();

            const taxaAostragem = audioContext.sampleRate;
            const amostrasExibidas = Math.min(
                tamanhoBuffer, 
                Math.floor((tempoTotalMs / 1000.0) * taxaAostragem)
            );

            const larguraFatia = canvas.width * 1.0 / amostrasExibidas;
            let x = 0;
            let somaQuadrados = 0;
            let valorPico = 0;

            for (let i = 0; i < amostrasExibidas; i++) {
                const v = (dadosFormaOnda[i] - 128) / 128.0;
                const y = (v * canvas.height / 2) + (canvas.height / 2);

                if (i === 0) canvasCtx.moveTo(x, y);
                else canvasCtx.lineTo(x, y);

                x += larguraFatia;

                const absV = Math.abs(v);
                if (absV > valorPico) valorPico = absV;
                somaQuadrados += v * v;
            }

            canvasCtx.stroke();

            // Desenhar Bolinha Indicadora Visual (LED de 1 cm)
            desenharBolinhaLED();

            const rms = Math.sqrt(somaQuadrados / amostrasExibidas);
            document.getElementById('valRMS').textContent = rms.toFixed(4);
            document.getElementById('valPico').textContent = valorPico.toFixed(4);

            atualizarLogicaVibracall(rms);
        }

        function desenharGradeReticula() {
            const divisoesHorizontais = 10;
            const divisoesVerticais = 6;

            canvasCtx.lineWidth = 1;
            canvasCtx.strokeStyle = '#003311';

            for (let i = 1; i < divisoesHorizontais; i++) {
                canvasCtx.beginPath();
                canvasCtx.moveTo(i * (canvas.width / divisoesHorizontais), 0);
                canvasCtx.lineTo(i * (canvas.width / divisoesHorizontais), canvas.height);
                canvasCtx.stroke();
            }

            for (let j = 1; j < divisoesVerticais; j++) {
                canvasCtx.beginPath();
                canvasCtx.moveTo(0, j * (canvas.height / divisoesVerticais));
                canvasCtx.lineTo(canvas.width, j * (canvas.height / divisoesVerticais));
                canvasCtx.stroke();
            }

            canvasCtx.strokeStyle = '#006622';
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height / 2);
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();

            canvasCtx.fillStyle = '#00aa44';
            canvasCtx.font = '10px monospace';
            const msPorDiv = (tempoTotalMs / divisoesHorizontais).toFixed(2);
            canvasCtx.fillText(`${tempoTotalMs.toFixed(1)} ms/tela | ${msPorDiv} ms/div`, 8, 14);
        }

        function desenharLinhaSetpoint(limite, cor) {
            const ySuperior = (canvas.height / 2) - (limite * canvas.height / 2);
            const yInferior = (canvas.height / 2) + (limite * canvas.height / 2);

            canvasCtx.lineWidth = 1;
            canvasCtx.strokeStyle = cor;
            canvasCtx.setLineDash([5, 5]);

            canvasCtx.beginPath();
            canvasCtx.moveTo(0, ySuperior);
            canvasCtx.lineTo(canvas.width, ySuperior);
            canvasCtx.moveTo(0, yInferior);
            canvasCtx.lineTo(canvas.width, yInferior);
            canvasCtx.stroke();

            canvasCtx.setLineDash([]);
        }

        function desenharBolinhaLED() {
            // Diâmetro de ~1 cm (raio de 19 pixels)
            const raioLED = 19; 
            const xLED = canvas.width - 35;
            const yLED = 35;

            let corLED = '#222222'; // Desligado / Off
            let corBorda = '#444444';

            if (estadoVibracall === "CONTÍNUO") {
                corLED = '#ff3366'; // Vermelho Aceso
                corBorda = '#ffffff';
            } else if (estadoVibracall === "PULSANTE") {
                if (estadoLedPulsante) {
                    corLED = '#ffcc00'; // Amarelo Aceso
                    corBorda = '#ffffff';
                } else {
                    corLED = '#332a00'; // Amarelo Apagado
                    corBorda = '#665500';
                }
            }

            canvasCtx.beginPath();
            canvasCtx.arc(xLED, yLED, raioLED, 0, 2 * Math.PI, false);
            canvasCtx.fillStyle = corLED;
            canvasCtx.fill();
            canvasCtx.lineWidth = 3;
            canvasCtx.strokeStyle = corBorda;
            canvasCtx.stroke();
        }

function atualizarLogicaVibracall(rms) {
    if (rms > limiteL2) {
        // Sinal Forte (Acima de L2) -> Alerta de aproximação excessiva
        if (estadoVibracall !== "PULSANTE") {
            estadoVibracall = "PULSANTE";
            iniciarPulsacao();
        }
    } else if (rms < limiteL1) {
        // Sinal Fraco (Abaixo de L1) -> Alerta de afastamento / perda da pista
        if (estadoVibracall !== "CONTÍNUO") {
            estadoVibracall = "CONTÍNUO";
            iniciarContinuo();
        }
    } else {
        // Sinal Médio (Entre L1 e L2) -> Zona central ideal / SILÊNCIO
        if (estadoVibracall !== "OFF") {
            estadoVibracall = "OFF";
            pararTodosVibracall();
        }
    }
}
        function iniciarPulsacao() {
            pararTodosVibracall();
            estadoLedPulsante = false;
            
            temporizadorPulsacao = setInterval(() => {
                estadoLedPulsante = !estadoLedPulsante;
                
                if (!vibracallMutado && estadoLedPulsante && "vibrate" in navigator) {
                    navigator.vibrate(120);
                }
            }, 200);
        }

        function iniciarContinuo() {
            pararTodosVibracall();
            
            if (!vibracallMutado && "vibrate" in navigator) {
                navigator.vibrate(2000);
            }
            
            temporizadorContinuo = setInterval(() => {
                if (!vibracallMutado && "vibrate" in navigator) {
                    navigator.vibrate(2000);
                }
            }, 1800);
        }

        function pararTodosVibracall() {
            if (temporizadorPulsacao) {
                clearInterval(temporizadorPulsacao);
                temporizadorPulsacao = null;
            }
            if (temporizadorContinuo) {
                clearInterval(temporizadorContinuo);
                temporizadorContinuo = null;
            }
            estadoLedPulsante = false;
            pararTodosVibracallMotor();
        }

        function pararTodosVibracallMotor() {
            if ("vibrate" in navigator) {
                navigator.vibrate(0);
            }
        }
    </script>
</body>
</html>
