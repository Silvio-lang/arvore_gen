<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador - Carrinho Guiado por Cabo Emissor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #toast {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen w-screen overflow-hidden">

  <!-- CABEÇALHO COMPACTO (UMA LINHA) -->
  <header class="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between z-10 shrink-0">
    <div class="flex items-center gap-2 truncate">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
      <h1 class="text-sm font-semibold tracking-wide text-slate-100 truncate">Carrinho Guiado por Cabo Emissor</h1>
    </div>
    
    <div class="flex items-center gap-2 shrink-0">
      <button id="btn-reset" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 rounded border border-slate-700 font-medium">
        Resetar
      </button>
      <button id="btn-config" class="p-1.5 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white rounded flex items-center justify-center">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- ÁREA DA SIMULAÇÃO (CANVAS INTEIRO) -->
  <main class="relative flex-1 w-full h-full bg-slate-950 overflow-hidden cursor-grab active:cursor-grabbing">
    <canvas id="simCanvas" class="w-full h-full block"></canvas>
    
    <!-- DICA VISUAL EM OVERLAY -->
    <div class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-slate-900/80 backdrop-blur border border-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-full pointer-events-none shadow-lg whitespace-nowrap">
      Arraste na tela para deslocar a pista
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="absolute top-3 left-1/2 -translate-x-1/2 bg-indigo-600 text-white text-xs px-3 py-1.5 rounded shadow-lg pointer-events-none opacity-0 translate-y-2 z-50">
      Notificação
    </div>
  </main>

  <!-- MODAL POP-UP DE AJUSTES (PAINEL DIFERENCIADO) -->
  <div id="modal-config" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-sm w-full p-5 shadow-2xl flex flex-col gap-4">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 class="text-sm font-bold text-slate-100 uppercase tracking-wider flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
          Ajustes da Simulação
        </h2>
        <button id="btn-close-modal" class="text-slate-400 hover:text-white p-1 text-lg font-bold">✕</button>
      </div>

      <div class="space-y-4">
        <!-- CONTROLE: COMPRIMENTO DA HASTE -->
        <div>
          <div class="flex justify-between text-xs font-medium mb-1">
            <span class="text-slate-300">Comprimento da Haste (Sensor Avançado)</span>
            <span id="val-haste" class="text-indigo-400 font-mono">60 px</span>
          </div>
          <input type="range" id="input-haste" min="20" max="150" value="60" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
        </div>

        <!-- CONTROLE: ÁNGULO DE ESTERÇAMENTO -->
        <div>
          <div class="flex justify-between text-xs font-medium mb-1">
            <span class="text-slate-300">Ângulo Máximo das Rodas</span>
            <span id="val-angulo" class="text-indigo-400 font-mono">15°</span>
          </div>
          <input type="range" id="input-angulo" min="5" max="35" value="15" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
        </div>

        <!-- CONTROLE: VELOCIDADE -->
        <div>
          <div class="flex justify-between text-xs font-medium mb-1">
            <span class="text-slate-300">Velocidade do Carrinho</span>
            <span id="val-velocidade" class="text-indigo-400 font-mono">2.0</span>
          </div>
          <input type="range" id="input-velocidade" min="0.5" max="5.0" step="0.1" value="2.0" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
        </div>

        <!-- CONTROLE: DESLOCAMENTO MANUAL DO CABO -->
        <div>
          <div class="flex justify-between text-xs font-medium mb-1">
            <span class="text-slate-300">Deslocamento da Pista (Offset)</span>
            <span id="val-offset" class="text-indigo-400 font-mono">0 px</span>
          </div>
          <input type="range" id="input-offset" min="-150" max="150" value="0" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
        </div>
      </div>

      <div class="pt-2">
        <button id="btn-aplicar-modal" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs rounded-lg shadow transition">
          Concluir e Voltar
        </button>
      </div>

    </div>
  </div>

  <script>
    // ELEMENTOS DO DOM
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const modalConfig = document.getElementById('modal-config');
    const btnConfig = document.getElementById('btn-config');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const btnAplicarModal = document.getElementById('btn-aplicar-modal');
    const btnReset = document.getElementById('btn-reset');
    const toast = document.getElementById('toast');

    // CONTROLES SLIDERS
    const inputHaste = document.getElementById('input-haste');
    const inputAngulo = document.getElementById('input-angulo');
    const inputVelocidade = document.getElementById('input-velocidade');
    const inputOffset = document.getElementById('input-offset');

    const valHaste = document.getElementById('val-haste');
    const valAngulo = document.getElementById('val-angulo');
    const valVelocidade = document.getElementById('val-velocidade');
    const valOffset = document.getElementById('val-offset');

    // PARÂMETROS DA SIMULAÇÃO
    let config = {
      hasteLength: 60,
      maxSteerAngle: 15 * (Math.PI / 180),
      speed: 2.0,
      caboOffset: 0,
      caboWidth: 12
    };

    // ESTADO DO VEÍCULO (GEOMETRIA ACKERMANN/BICICLETA)
    let vehicle = {
      x: 0,
      y: 0,
      heading: 0,
      wheelbase: 40,
      steerAngle: 0,
      sensorTouched: false,
      trail: []
    };

    let isDragging = false;
    let dragStartX = 0;
    let initialOffset = 0;
    let toastTimeout = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-2');
      }, 2000);
    }

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      if (vehicle.y === 0) {
        resetVehicle();
      }
    }

    function resetVehicle() {
      const centerX = canvas.width / 2;
      vehicle.x = centerX;
      vehicle.y = canvas.height - 80;
      vehicle.heading = -Math.PI / 2;
      vehicle.steerAngle = 0;
      vehicle.trail = [];
      config.caboOffset = 0;
      inputOffset.value = 0;
      valOffset.textContent = '0 px';
      showToast("Simulação Reiniciada");
    }

function updatePhysics() {
  // 1. Posição do eixo dianteiro
  const frontAxleX = vehicle.x + Math.cos(vehicle.heading) * vehicle.wheelbase;
  const frontAxleY = vehicle.y + Math.sin(vehicle.heading) * vehicle.wheelbase;

  // 2. Posição da ponta do sensor na haste avançada (Look-ahead)
  const sensorX = frontAxleX + Math.cos(vehicle.heading) * config.hasteLength;
  const sensorY = frontAxleY + Math.sin(vehicle.heading) * config.hasteLength;

  // 3. Posição do cabo emissor de referência
  const caboX = (canvas.width / 2) + config.caboOffset;

  // 4. Verificação binária do sensor
  const distToCabo = Math.abs(sensorX - caboX);
  vehicle.sensorTouched = distToCabo <= (config.caboWidth / 2);

  // 5. LÓGICA DE CONTROLE CORRIGIDA (Bang-Bang baseada na posição do sensor):
  // Se o sensor está à esquerda do cabo: esterça para a direita (+angle)
  // Se o sensor está à direita do cabo ou tocando: esterça para a esquerda (-angle)
  if (sensorX < caboX) {
    // Sensor está à esquerda da linha -> Virar para a direita para buscar a linha
    vehicle.steerAngle = config.maxSteerAngle;
  } else {
    // Sensor está sobre ou à direita da linha -> Virar para a esquerda para voltar/sair
    vehicle.steerAngle = -config.maxSteerAngle;
  }

  // 6. Atualização da orientação e posição do veículo (Geometria Ackermann)
  vehicle.heading += (config.speed / vehicle.wheelbase) * Math.tan(vehicle.steerAngle);
  vehicle.x += config.speed * Math.cos(vehicle.heading);
  vehicle.y += config.speed * Math.sin(vehicle.heading);

  // 7. Registro do rastro percorrido pelo sensor
  vehicle.trail.push({
    x: sensorX,
    y: sensorY,
    touched: vehicle.sensorTouched
  });

  if (vehicle.trail.length > 250) {
    vehicle.trail.shift();
  }

  // Loop contínuo da tela quando o carrinho sobe todo o percurso
  if (vehicle.y < -50) {
    vehicle.y = canvas.height + 20;
    vehicle.trail = [];
  }
}

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const caboX = (canvas.width / 2) + config.caboOffset;

      // DESENHO DO CABO EMISSOR
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = config.caboWidth;
      ctx.shadowColor = '#0284c7';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(caboX, 0);
      ctx.lineTo(caboX, canvas.height);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // LINHA CENTRAL DO CABO
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(caboX, 0);
      ctx.lineTo(caboX, canvas.height);
      ctx.stroke();

      // RASTRO DO SENSOR
      for (let i = 1; i < vehicle.trail.length; i++) {
        const p1 = vehicle.trail[i - 1];
        const p2 = vehicle.trail[i];
        ctx.strokeStyle = p2.touched ? '#22c55e' : '#ef4444';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      // CORPO DO CARRINHO
      ctx.save();
      ctx.translate(vehicle.x, vehicle.y);
      ctx.rotate(vehicle.heading);

      ctx.fillStyle = '#334155';
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.5;
      ctx.fillRect(-10, -15, vehicle.wheelbase + 15, 30);
      ctx.strokeRect(-10, -15, vehicle.wheelbase + 15, 30);

      // RODAS TRASEIRAS
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-5, -18, 12, 5);
      ctx.fillRect(-5, 13, 12, 5);

      // RODAS DIANTEIRAS (ESTERÇADAS)
      ctx.save();
      ctx.translate(vehicle.wheelbase, -15);
      ctx.rotate(vehicle.steerAngle);
      ctx.fillRect(-6, -2.5, 12, 5);
      ctx.restore();

      ctx.save();
      ctx.translate(vehicle.wheelbase, 15);
      ctx.rotate(vehicle.steerAngle);
      ctx.fillRect(-6, -2.5, 12, 5);
      ctx.restore();

      // HASTE AVANÇADA
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(vehicle.wheelbase, 0);
      ctx.lineTo(vehicle.wheelbase + config.hasteLength, 0);
      ctx.stroke();

      // SENSOR NA PONTA DA HASTE
      ctx.fillStyle = vehicle.sensorTouched ? '#22c55e' : '#ef4444';
      ctx.beginPath();
      ctx.arc(vehicle.wheelbase + config.hasteLength, 0, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();
    }

    function loop() {
      updatePhysics();
      draw();
      requestAnimationFrame(loop);
    }

    // EVENTOS DO POP-UP MODAL DE CONFIGURAÇÕES
    btnConfig.addEventListener('click', () => {
      modalConfig.classList.remove('hidden');
    });

    btnCloseModal.addEventListener('click', () => {
      modalConfig.classList.add('hidden');
    });

    btnAplicarModal.addEventListener('click', () => {
      modalConfig.classList.add('hidden');
      showToast("Configurações Aplicadas");
    });

    btnReset.addEventListener('click', resetVehicle);

    // VINCULAÇÃO DOS SLIDERS
    inputHaste.addEventListener('input', (e) => {
      config.hasteLength = parseFloat(e.target.value);
      valHaste.textContent = `${config.hasteLength} px`;
    });

    inputAngulo.addEventListener('input', (e) => {
      const deg = parseFloat(e.target.value);
      config.maxSteerAngle = deg * (Math.PI / 180);
      valAngulo.textContent = `${deg}°`;
    });

    inputVelocidade.addEventListener('input', (e) => {
      config.speed = parseFloat(e.target.value);
      valVelocidade.textContent = config.speed.toFixed(1);
    });

    inputOffset.addEventListener('input', (e) => {
      config.caboOffset = parseFloat(e.target.value);
      valOffset.textContent = `${config.caboOffset} px`;
    });

    // ARRASTE DA PISTA NO CANVAS
    function handlePointerDown(e) {
      if (!modalConfig.classList.contains('hidden')) return;
      isDragging = true;
      dragStartX = e.clientX || (e.touches && e.touches[0].clientX);
      initialOffset = config.caboOffset;
    }

    function handlePointerMove(e) {
      if (!isDragging) return;
      const currentX = e.clientX || (e.touches && e.touches[0].clientX);
      const deltaX = currentX - dragStartX;
      config.caboOffset = Math.max(-150, Math.min(150, initialOffset + deltaX));
      inputOffset.value = config.caboOffset;
      valOffset.textContent = `${Math.round(config.caboOffset)} px`;
    }

    function handlePointerUp() {
      if (isDragging) {
        isDragging = false;
        showToast("Pista Deslocada");
      }
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);

    canvas.addEventListener('touchstart', handlePointerDown);
    window.addEventListener('touchmove', handlePointerMove);
    window.addEventListener('touchend', handlePointerUp);

    window.addEventListener('resize', resizeCanvas);

    // INICIALIZAÇÃO
    resizeCanvas();
    loop();
  </script>
</body>
</html>
